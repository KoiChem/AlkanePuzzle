<style>
:root{
    /* ノート紙のトーン */

    --border:#d8d3c0;

    --text:#33302a;

    --accent:#2a9d8f;
    --accent-ink:#1f8175;
    --accent-soft:#d7f0ec;
    --highlighter:rgba(120,220,120,0.42); /* 蛍光ペンの黄緑 */

    --cat-number-bg:#e3f0fb; --cat-number-border:#8fbfe4;

    --cat-subname-bg:#e6f6ea; --cat-subname-border:#94cfa3;
    --cat-basename-bg:#fdf0e0; --cat-basename-border:#e8b877;
    color-scheme: light;
  }

*{box-sizing:border-box}body{margin:0;color:#33302a;background:linear-gradient(#5a96be20 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,#5a96be20 1px,transparent 1px) 0 0/22px 22px,#faf8f0;font-family:'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif}main{max-width:850px;margin:auto;padding:16px}h1{font-size:clamp(20px,4vw,30px);margin:0 0 14px}h1 span{background:linear-gradient(transparent 65%,#bde8b3 65%)}button{font:inherit;font-weight:bold;border:2px solid #d8d3c0;background:#fffdf6;color:inherit;border-radius:18px;min-height:48px;padding:8px 16px;cursor:pointer;touch-action:manipulation}button[aria-pressed=true]{border-width:1.25px;border-color:#2a9d8f;background:#d7f0ec;box-shadow:inset 0 -4px #2a9d8f}button:focus-visible{outline:3px solid #2a9d8f;outline-offset:3px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}.palette{background:#fffdf6;border:3px solid #33302a;border-radius:24px;padding:12px;margin-top:16px}.palette .toolbar{justify-content:center}.bond{font-size:28px;min-width:72px}.carbon{width:76px;padding:0}.carbon svg{height:64px}#board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;touch-action:none;user-select:none;-webkit-user-select:none}.cell{aspect-ratio:1;border:2px dashed #d8d3c0;border-radius:14px;min-width:0;padding:0;background:#fffdf6aa;touch-action:none}.cell.filled{border-style:solid;background:#fffdf6}.cell svg{display:block;width:100%;height:100%;pointer-events:none}.cell:focus-visible{outline-offset:0}#status{min-height:26px;margin-top:10px;color:#1f8175}p{font-size:14px;line-height:1.7;margin:8px 0}button:disabled{opacity:.4;cursor:default}@media(max-width:450px){main{padding:10px}.toolbar{gap:8px}button{padding:8px 12px}.bond{min-width:60px}.carbon{width:52px;padding:0}.carbon svg{height:48px}#board{gap:3px}.cell{border-radius:9px}}

body{font-family:var(--font-hand)}
button{border:2.5px solid var(--border);border-radius:14px 12px 15px 11px;background:var(--surface);color:var(--text-muted);box-shadow:1px 2px 0 var(--shadow)}
button:active{transform:translate(1px,2px)}
button[aria-pressed=true]{border-width:1.25px;border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);outline:1px solid var(--accent);outline-offset:-1px;box-shadow:1px 2px 0 var(--shadow)}
.palette{background:var(--surface);border:2.5px solid var(--ink);border-radius:20px 18px 22px 19px;box-shadow:2px 3px 0 var(--shadow);padding:9px 10px}
.cell{border:2px dashed var(--border);border-radius:12px 10px 13px 11px;box-shadow:none;color:var(--text);min-height:0}
.cell.filled{background:var(--surface)}
#tools .bond,#tools .oxygen,.carbon{width:58px;height:58px;min-width:0;min-height:48px;padding:3px 2px;border-radius:12px;flex:none}
#tools svg,.carbon svg{display:block;width:52px;max-width:100%;height:auto;aspect-ratio:1;margin:auto;pointer-events:none}
#tools{gap:8px}#carbons{gap:8px}.carbon{border:2px solid transparent;box-shadow:none;background:transparent}
@media(max-width:450px){#tools .bond,#tools .oxygen,.carbon{width:48px;height:48px}#tools,#carbons{gap:8px}}
#board{width:min(94vw,490px);max-width:100%;gap:3px;margin:0 auto 10px}.cell{border-width:1.5px;border-radius:11px 9px 12px 10px;background:var(--paper);overflow:hidden}.cell.filled{border-width:1px}.palette{max-width:490px;margin:16px auto}main>.toolbar{max-width:490px;margin:12px auto}#undo{width:44px;height:44px;min-height:44px;padding:6px;flex:none;border-color:transparent;box-shadow:none;background:transparent;color:var(--accent-ink)}#undo svg{display:block;width:100%;height:100%}#carbons{flex-wrap:nowrap;gap:6px}#carbons .carbon{flex:0 1 58px;min-width:0}#clear{width:64px;flex:none;padding:4px;font-size:14px}.bond-glow{animation:bondGlow 1200ms linear forwards}.ghost{position:fixed;pointer-events:none;width:60px;height:60px;transform:translate(-50%,-50%);z-index:999;opacity:.9;filter:drop-shadow(2px 3px 2px var(--shadow))}.picked{outline:3px solid var(--accent);opacity:.55}@keyframes bondGlow{0%,83%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.bond-glow{animation:none;opacity:.5}}
#tools{display:grid;grid-template-columns:44px repeat(6,minmax(0,1fr));width:100%;gap:6px;align-items:center}#tools .bond,#tools .oxygen{width:100%;max-width:58px}#tools #undo{max-width:100%}
#question-panel{max-width:490px;margin:0 auto 14px;text-align:center}#question-panel[hidden]{display:none}#question-name{font-weight:800;font-size:20px;min-height:30px}#question-panel .toolbar,.learning-modes{justify-content:center;gap:8px}.categories button{font-size:13px;padding:6px 10px}#question-feedback{min-height:26px;color:var(--accent-ink);font-weight:700}#names[hidden]{display:none}</style>
<main><h1><span>アルカンパズル</span> <small>不飽和結合</small></h1><div class="toolbar learning-modes"><button id="practice-mode" aria-pressed="true">練習</button><button id="quiz-mode" aria-pressed="false">出題</button></div>
<section id="question-panel" hidden aria-label="構造を描く問題"><div class="toolbar categories" aria-label="出題分類"><button data-category="hydrocarbon" aria-pressed="true">炭化水素（脂肪族のみ）</button><button data-category="oxygen" aria-pressed="true">酸素あり</button><button data-category="aromatic" aria-pressed="true">芳香族</button></div><div id="question-name" aria-live="polite"></div><div class="toolbar"><button id="check-structure">チェック</button><button id="next-question">次の問題</button></div><div id="question-feedback" role="status"></div></section><div id="board" aria-label="練習用5行7列グリッド"></div>
<div class="palette"><div class="toolbar" id="tools"><button data-tool="1" class="bond" aria-label="単結合" aria-pressed="false">−</button><button data-tool="2" class="bond" aria-label="二重結合" aria-pressed="false">＝</button><button data-tool="3" class="bond" aria-label="三重結合" aria-pressed="false">≡</button><button data-tool="OH" aria-pressed="false">−OH</button><button data-tool="O" aria-pressed="false">−O−</button></div><div class="toolbar" id="carbons"></div></div>
<div class="toolbar"><button id="undo">↶ 戻す</button><button id="clear">クリア</button></div><div id="names" aria-live="polite"></div><div id="status" role="status" aria-live="polite"></div></main>

<script>
'use strict';
const dirs=['N','E','S','W'],vec={N:[-1,0],E:[0,1],S:[1,0],W:[0,-1]},opp={N:'S',S:'N',E:'W',W:'E'},templates=[['E'],['E','W'],['N','E'],['N','E','W'],dirs];
let atoms={},bonds={},tool=null,history=[],gesture=null,timer=null;let glow=new Map(),lastGlowState="",glowStart=0;
const board=document.querySelector('#board'),status=document.querySelector('#status');
const key=(r,c)=>r+','+c,parse=k=>k.split(',').map(Number),edge=(a,b)=>[a,b].sort().join('|'),copy=x=>JSON.parse(JSON.stringify(x));
function neighbor(k,d){const [r,c]=parse(k),[dr,dc]=vec[d];return key(r+dr,c+dc)}
function direction(a,b){return dirs.find(d=>neighbor(a,d)===b)}
function links(k){return Object.entries(bonds).flatMap(([e,n])=>{const [a,b]=e.split('|');return a===k?[{other:b,n,dir:direction(a,b)}]:b===k?[{other:a,n,dir:direction(b,a)}]:[]})}
function sum(k){return links(k).reduce((n,b)=>n+b.n,0)}
function save(){history.push(JSON.stringify({atoms,bonds}));document.querySelector('#undo').disabled=false}
function restore(s){({atoms,bonds}=JSON.parse(s));render()}
function message(s){status.textContent=s}
function hydrogen(k){const a=atoms[k],ls=links(k);if(a.e==='O'){if(a.kind==='O'&&ls.length===0)return [];return sum(k)===1?[opp[ls[0].dir]]:[]}
 const active=new Set(a.arms),free=dirs.filter(d=>!active.has(d));let count=4-ls.reduce((s,l)=>s+l.n,0)-(a.arms.length-ls.length);
 const triple=ls.find(l=>l.n===3);if(triple)return count>0?[opp[triple.dir]]:[];
 let remaining=[...free];for(const l of ls){for(let i=1;i<l.n;i++){let removal=opp[l.dir];if(!remaining.includes(removal))removal=(l.dir==='E'||l.dir==='W')?'S':'E';if(!remaining.includes(removal))removal=remaining[remaining.length-1];if(a.flip&&remaining.length===2)removal=remaining.find(d=>d!==removal);remaining=remaining.filter(d=>d!==removal)}}return remaining.slice(0,Math.max(0,count))}
function icon(a,k){let lines='';const ls=k?links(k):[],hs=k?hydrogen(k):dirs.filter(d=>!a.arms.includes(d));const arm=(d,n=1,color='#33302a')=>{const [y,x]=vec[d];return Array.from({length:n},(_,i)=>{const off=(i-(n-1)/2)*10;return `<line x1="${50+x*13-y*off}" y1="${50+y*13+x*off}" x2="${50+x*44-y*off}" y2="${50+y*44+x*off}" stroke="${color}" stroke-width="3"/>`}).join('')};
 for(const d of a.arms){const l=ls.find(l=>l.dir===d);lines+=arm(d,l?.n||1,l||!k?'#33302a':'#c9721a')}
 for(const d of hs){const [y,x]=vec[d];lines+=`<line x1="${50+x*13}" y1="${50+y*13}" x2="${50+x*25}" y2="${50+y*25}" stroke="#6f6a5d" stroke-width="2"/><circle cx="${50+x*32}" cy="${50+y*32}" r="6" stroke="#6f6a5d" stroke-width="2" fill="#fffdf6"/>`}
 let underlay='';if(k&&glow.has(k)){for(const l of ls){const [y,x]=vec[l.dir];underlay+=`<line class="bond-glow" x1="${50+x*13}" y1="${50+y*13}" x2="${50+x*44}" y2="${50+y*44}" stroke="${glow.get(k)}" stroke-width="14" stroke-linecap="round"/>`}}return `<svg viewBox="0 0 100 100" aria-hidden="true">${underlay}${lines}<circle cx="50" cy="50" r="14" fill="${a.e==='O'?'#e8564f':'#33302a'}"/></svg>`}
function reconnect(){for(const e of Object.keys(bonds)){const [a,b]=e.split('|');if(!atoms[a]||!atoms[b]||!atoms[a].arms.includes(direction(a,b))||!atoms[b].arms.includes(direction(b,a)))delete bonds[e]}
 for(const [k,a]of Object.entries(atoms)){if(a.e!=='O')continue;const incoming=dirs.filter(d=>{const b=atoms[neighbor(k,d)];return b?.e==='C'&&b.arms.includes(opp[d])});if(sum(k)<2)a.arms=incoming.slice(0,a.kind==='OH'?1:2)}
 for(const [k,a]of Object.entries(atoms))for(const d of a.arms){const b=neighbor(k,d);if(atoms[b]?.arms.includes(opp[d])&&!bonds[edge(k,b)]&&sum(k)<(a.e==='O'?2:4)&&sum(b)<(atoms[b].e==='O'?2:4))bonds[edge(k,b)]=1}}
function updateGlow(){const state=JSON.stringify({atoms,bonds});if(state===lastGlowState)return;lastGlowState=state;glow=new Map();const full=UnsatNaming.graph(atoms,bonds);const seen=new Set();for(const start of full.ids){if(seen.has(start))continue;const ids=[start];seen.add(start);for(let i=0;i<ids.length;i++)for(const b of full.adj.get(ids[i]))if(!seen.has(b.id)){seen.add(b.id);ids.push(b.id)}const g=UnsatNaming.graph(atoms,Object.fromEntries(Object.entries(bonds).filter(([e])=>e.split('|').every(k=>ids.includes(k)))),ids);if(UnsatNaming.complete(g)){const color=UnsatNaming.rings(g).length?'rgba(255,161,45,.48)':'rgba(120,220,120,.42)';ids.forEach(k=>glow.set(k,color))}}glowStart=performance.now()}
function render(){updateGlow();for(const el of board.children){const k=el.dataset.k,a=atoms[k];el.classList.remove('picked');el.classList.toggle('filled',!!a);el.innerHTML=a?icon(a,k):'';el.setAttribute('aria-label',`${parse(k).map(n=>n+1).join('行')}列${a?(a.e==='C'?' 炭素':' 酸素'): ' 空き'}`)}document.querySelector('#undo').disabled=!history.length;UnsatNaming.render(document.querySelector('#names'),atoms,bonds,hydrogen);window.UnsatQuiz?.edited()}
function setBond(a,b,n){if(!atoms[a]||!atoms[b])return false;const old=bonds[edge(a,b)]||0;for(const k of [a,b]){const atom=atoms[k],lim=atom.e==='O'?2:4;if(sum(k)+(atom.e==='C'?atom.arms.length-links(k).length:0)-(old|| (atom.arms.includes(direction(k,k===a?b:a))?1:0))+n>lim){message('価数を超えるため変更できません');return false}}for(const [x,y]of [[a,b],[b,a]]){const d=direction(x,y);if(!atoms[x].arms.includes(d))atoms[x].arms.push(d);atoms[x].flip=false}bonds[edge(a,b)]=n;message('');return true}
function draw(a,b){for(const k of [a,b])if(!atoms[k])atoms[k]={e:'C',arms:[],flip:false};setBond(a,b,1)}
function remove(k){delete atoms[k];for(const e of Object.keys(bonds))if(e.split('|').includes(k))delete bonds[e]}
function placeBenzene(k){const [r,c]=parse(k),candidates=[];for(let row=0;row<4;row++)for(let col=0;col<5;col++)if(r>=row&&r<=row+1&&c>=col&&c<=col+2)candidates.push([row,col]);candidates.sort((a,b)=>(Math.abs(a[0]-r)+Math.abs(a[1]-(c-1)))-(Math.abs(b[0]-r)+Math.abs(b[1]-(c-1))));for(const [row,col]of candidates){const path=[[0,0],[0,1],[0,2],[1,2],[1,1],[1,0]].map(([dr,dc])=>key(row+dr,col+dc));if(path.some(k=>atoms[k]))continue;for(const k of path)atoms[k]={e:'C',arms:[],flip:false};path.forEach((a,i)=>setBond(a,path[(i+1)%6],i%2===0?2:1));message('');return}message('ベンゼン環を置くには3列×2行の空きが必要です')}
function place(k){if(tool==='benzene'){placeBenzene(k)}else if(tool==='erase'){remove(k)}else if(tool==='OH'||tool==='O'){remove(k);atoms[k]={e:'O',kind:tool,arms:[],flip:false};reconnect()}else if(tool?.startsWith('C')){remove(k);atoms[k]={e:'C',arms:[...templates[Number(tool.slice(1))]],flip:false};reconnect()}}
function tap(k){if(tool==='benzene'||tool==='erase'||tool==='OH'||tool==='O'||tool?.startsWith('C')){save();place(k)}else if(tool==='2'&&atoms[k]?.e==='C'&&links(k).some(l=>l.n===2)){save();atoms[k].flip=!atoms[k].flip}else if(!tool&&atoms[k]?.e==='C'){save();atoms[k].arms=atoms[k].arms.map(d=>dirs[(dirs.indexOf(d)+1)%4]);reconnect()}render()}
function select(t){tool=tool===t?null:t;for(const b of document.querySelectorAll('[data-tool]'))b.setAttribute('aria-pressed',String(b.dataset.tool===tool));message('')}
for(let r=0;r<5;r++)for(let c=0;c<7;c++){const el=document.createElement('button');el.className='cell';el.dataset.k=key(r,c);board.append(el);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(el.dataset.k)}})}
templates.forEach((arms,i)=>{const b=document.createElement('button');b.className='carbon';b.dataset.tool='C'+i;b.setAttribute('aria-label',['末端の炭素','直線の炭素','角の炭素','分岐の炭素','四方向の炭素'][i]);b.setAttribute('aria-pressed','false');b.innerHTML=icon({e:'C',arms},null);document.querySelector('#carbons').append(b)});
for(const b of document.querySelectorAll('.bond')){const n=Number(b.dataset.tool);b.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true">'+Array.from({length:n},(_,i)=>`<line x1="15" x2="85" y1="${50+(i-(n-1)/2)*12}" y2="${50+(i-(n-1)/2)*12}" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>`).join('')+'</svg>'}
const oxygenButton=document.querySelector('[data-tool="O"]');oxygenButton.classList.add('oxygen');oxygenButton.setAttribute('aria-label','二つの単結合を持つ酸素');oxygenButton.innerHTML=icon({e:'O',arms:['E','W']},null).replace(/<line[^>]*stroke="#6f6a5d"[^>]*\/>|<circle[^>]*r="6"[^>]*\/>/g,'');
const ohButton=document.querySelector('[data-tool="OH"]');ohButton.classList.add('oxygen');ohButton.setAttribute('aria-label','ヒドロキシ基');ohButton.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="14" fill="#E8564F"/><circle cx="64.1" cy="35.9" r="6" fill="var(--paper)" stroke="var(--text-muted)" stroke-width="2"/></svg>';
document.querySelector('#undo').setAttribute('aria-label','盤面の操作を1つ戻す');document.querySelector('#undo').innerHTML='<svg viewBox="0 0 1000 936" width="28" height="28" aria-hidden="true"><path d="M416 835 A345 345 0 1 0 269 249" fill="none" stroke="currentColor" stroke-width="82" stroke-linecap="round"/><path d="M155 117 L70 462 L409 365 Z" fill="currentColor"/></svg>';
document.querySelector('#tools').prepend(document.querySelector('#undo'));document.querySelector('#carbons').append(document.querySelector('#clear'));
const benzene=document.createElement('button');benzene.dataset.tool='benzene';benzene.className='oxygen';benzene.setAttribute('aria-label','ベンゼン環');benzene.setAttribute('aria-pressed','false');benzene.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 12 L83 31 L83 69 L50 88 L17 69 L17 31 Z M26 36 L50 22 M73 36 L73 64 M50 77 L27 64" fill="none" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/></svg>';document.querySelector('#tools').append(benzene);
for(const b of document.querySelectorAll('[data-tool]'))b.onclick=()=>select(b.dataset.tool);
board.onpointerdown=e=>{if(!e.isPrimary||e.button!==0)return;e.preventDefault();const el=e.target.closest('.cell');if(!el)return;gesture={pointerId:e.pointerId,start:el.dataset.k,last:el.dataset.k,before:JSON.stringify({atoms,bonds}),moved:false,move:false};timer=setTimeout(()=>{if(gesture&&atoms[gesture.start]&&!tool){gesture.move=true;const ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=icon(atoms[gesture.start],gesture.start);ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.body.append(ghost);document.querySelector(`[data-k="${gesture.start}"]`).classList.add('picked');message('')}},450)};
window.addEventListener('pointermove',e=>{if(!gesture||e.pointerId!==gesture.pointerId)return;const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(gesture.move){const ghost=document.querySelector('.ghost');if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}gesture.last=el&&board.contains(el)?el.dataset.k:null;gesture.moved=true;return}if(!el||!board.contains(el)||el.dataset.k===gesture.last)return;clearTimeout(timer);if(tool==='benzene')return;const k=el.dataset.k;if(!direction(gesture.last,k))return;gesture.moved=true;if(!tool)draw(gesture.last,k);else if(['1','2','3'].includes(tool))setBond(gesture.last,k,Number(tool));else place(k);gesture.last=k;render()});
window.addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.pointerId)return;clearTimeout(timer);clearGhost();const g=gesture;gesture=null;if(g.move&&g.moved&&(!g.last||!atoms[g.last])){const a=atoms[g.start];remove(g.start);if(g.last){atoms[g.last]=a;reconnect()}}else if(!g.moved){if(!g.move)tap(g.start);else render();return}if(g.before!==JSON.stringify({atoms,bonds}))history.push(g.before);message(status.textContent==='移動先で指を離してください'?'':status.textContent);render()});
function clearGhost(){document.querySelector('.ghost')?.remove()}
function cancel(){clearGhost();clearTimeout(timer);if(gesture){restore(gesture.before);gesture=null;message('')}}window.addEventListener('pointercancel',cancel);window.addEventListener('blur',cancel);
document.querySelector('#undo').onclick=()=>{if(history.length)restore(history.pop());message('')};document.querySelector('#clear').onclick=()=>{if(Object.keys(atoms).length){save();atoms={};bonds={};render();message('')}};
render();
</script><script src="unsat-questions.js?v=20261111-1"></script><script src="unsat-quiz.js?v=20261111-1"></script></html>
