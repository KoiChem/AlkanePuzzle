<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>アルカンパズルの設定</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8f5ed;color:#443e31;font-family:system-ui,sans-serif;line-height:1.65}
    main{max-width:720px;margin:auto;padding:20px 16px 40px}h1{font-size:23px}h2{font-size:18px;margin-top:0}
    a{color:#5b7654}section,dialog{background:#fffdf7;border:2px solid #c8bfab;border-radius:16px;padding:20px;margin:18px 0}
    label{display:block;font-weight:700;margin:12px 0 4px}input{display:block;width:100%;padding:12px;font:inherit;border:2px solid #c8bfab;border-radius:8px}
    button{font:inherit;padding:10px 14px;border:2px solid #9bad92;border-radius:12px;background:#edf2e8;color:#35462f;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.hint{font-size:13px;color:#665f50}
    [hidden]{display:none !important}#editor{border:0;width:100%;min-height:780px;background:#fffdf7;border-radius:12px}
    #status{white-space:pre-wrap;overflow-wrap:anywhere}dialog{width:min(94vw,540px);margin:auto}dialog::backdrop{background:#28241a88}
    :focus-visible{outline:3px solid #678b5b;outline-offset:3px}#saved-link{display:block;margin-top:8px}
  </style>
</head>
<body><main>
  <h1>アルカンパズルの設定</h1>
  <a href="index.html">パズルに戻る</a>
  <p id="status" role="status" aria-live="polite">管理パスワードを入力してください。</p>
  <section id="login-section">
    <form id="login-form">
      <label for="login-password">管理パスワード</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <div class="actions"><button id="login-button" type="submit">設定を開く</button></div>
    </form>
  </section>
  <section id="admin-section" hidden>
    <p>変更は「GitHubへ保存」で全端末の共通設定になります。</p>
    <div class="actions">
      <button id="save-button" type="button">GitHubへ保存</button>
      <button id="password-button" type="button">パスワード変更</button>
      <button id="publication-button" type="button" hidden>公開反映を確認</button>
      <button id="logout-button" type="button">ログアウト</button>
    </div>
    <a id="saved-link" hidden target="_blank" rel="noopener">保存した変更をGitHubで確認</a>
    <p class="hint">公開への反映後、各端末の起動・再読み込みで更新されます。パスワードの変更もGitHubへの保存が必要です。</p>
    <iframe id="editor" title="難易度設定" src="about:blank"></iframe>
  </section>
  <dialog id="save-dialog" aria-labelledby="save-title">
    <h2 id="save-title">共通設定をGitHubへ保存</h2>
    <form id="save-form">
      <label for="github-token">GitHubトークン</label>
      <input id="github-token" type="password" autocomplete="off" spellcheck="false" required>
      <p class="hint">対象リポジトリはKoiChem/AlkanePuzzle、ContentsはRead and writeにしてください。トークンは保存しません。</p>
      <div class="actions"><button id="save-confirm" type="submit">共通設定を保存</button><button id="save-cancel" type="button">キャンセル</button></div>
    </form>
  </dialog>
  <dialog id="password-dialog" aria-labelledby="password-title">
    <h2 id="password-title">パスワード変更</h2>
    <form id="password-form">
      <label for="current-password">現在のパスワード</label><input id="current-password" type="password" autocomplete="current-password" required>
      <label for="new-password">新しいパスワード</label><input id="new-password" type="password" autocomplete="new-password" required>
      <label for="confirm-password">新しいパスワード（確認）</label><input id="confirm-password" type="password" autocomplete="new-password" required>
      <p id="password-status" role="status"></p>
      <div class="actions"><button id="password-confirm" type="submit">変更を下書きに反映</button><button id="password-cancel" type="button">キャンセル</button></div>
    </form>
  </dialog>
  <noscript>設定画面を開くにはJavaScriptを有効にしてください。</noscript>
</main>
<script src="shared-settings.js?v=20261010-shared-v1"></script>
<script src="admin.js?v=20261010-shared-v1"></script>
</body></html>
