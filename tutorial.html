<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf8f0">
<title>アルカンパズル 操作チュートリアル</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tutorial.css">
<script defer src="tutorial-board.js"></script>
<script defer src="tutorial-steps.js"></script>
<script defer src="tutorial.js"></script>
</head>
<body>
<main>
 <header><div><p class="eyebrow">アルカンパズル</p><h1>操作チュートリアル</h1></div><a href="index.html" class="exit">練習へ<span aria-hidden="true"> ↗</span></a></header>
 <section class="lesson" aria-labelledby="target-name">
  <div class="progress"><span id="step-number">1 / 11</span><span id="sub-progress"></span></div>
  <h2 id="target-name">プロパン</h2>
  <div class="instruction-box"><p id="instruction" role="status" aria-live="polite"></p></div>
 </section>
 <div id="board" class="board"><div id="grid" class="grid" role="group" aria-label="分子を描く盤面"></div><svg id="route" class="route" viewBox="0 0 700 500" aria-hidden="true"></svg></div>
 <div id="palette" class="palette" role="group" aria-label="パネルデッキ">
  <div id="atom-row" class="palette-row atom-row"><button id="undo" class="undo" type="button" aria-label="盤面の操作を1つ戻す" title="盤面の操作を1つ戻す" disabled><svg viewBox="0 0 1000 936" aria-hidden="true"><path d="M416 835 A345 345 0 1 0 269 249" fill="none" stroke="currentColor" stroke-width="82" stroke-linecap="round"/><path d="M155 117 L70 462 L409 365 Z" fill="currentColor"/></svg></button></div>
  <div id="carbon-row" class="palette-row carbon-row"></div>
 </div>
 <p id="note" class="note"></p>
 <nav class="actions" aria-label="チュートリアルの操作"><button id="clear" type="button">クリア</button><button id="reset" type="button">この段階をやり直す</button><button id="next" class="primary" type="button" disabled>次へ →</button><button id="restart" type="button" hidden>最初から</button></nav>
 <p class="operation-hint">なぞる：炭素をつなぐ ／ パネルを選んでタップ：上書き<br>タップ：回転 ／ 2タップ：逆回転 ／ 3タップ：削除<br>長押し：つかんで移動 ／「戻す」：1操作取り消し</p>
 <noscript>チュートリアルを使うにはJavaScriptを有効にしてください。</noscript>
</main>
<div id="ghost" class="ghost" hidden aria-hidden="true"></div>
</body>
</html>
